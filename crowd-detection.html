
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Smart Temple - YOLOv8 Crowd Detection</title>

  <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.min.js"></script>

  <style>
    body {
      margin: 0;
      padding: 24px;
      font-family: Arial, sans-serif;
      background: #f3f6fa;
      color: #172b45;
    }

    .panel {
      max-width: 750px;
      margin: auto;
      padding: 22px;
      background: white;
      border: 1px solid #dce5ef;
      border-radius: 16px;
    }

    .video-box {
      position: relative;
      width: 100%;
      min-height: 220px;
      background: #101827;
      border-radius: 12px;
      overflow: hidden;
    }

    video {
      display: none;
    }

    canvas {
      display: block;
      width: 100%;
      height: auto;
    }

    .buttons {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }

    button {
      padding: 12px 18px;
      border: 0;
      border-radius: 9px;
      font-weight: bold;
      cursor: pointer;
    }

    #startBtn {
      background: #14263d;
      color: white;
    }

    #stopBtn {
      background: #e5edf6;
      color: #14263d;
    }

    button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    #count {
      font-size: 42px;
      font-weight: bold;
      margin-top: 18px;
    }

    #status {
      color: #607086;
      overflow-wrap: anywhere;
    }
  </style>
</head>

<body>
  <section class="panel">
    <h1>Live Crowd Detection</h1>
    <p>YOLOv8n · Webcam People Counter</p>

    <div class="video-box">
      <video id="video" autoplay muted playsinline></video>
      <canvas id="canvas" width="640" height="360"></canvas>
    </div>

    <div class="buttons">
      <button id="startBtn">Start Camera</button>
      <button id="stopBtn" disabled>Stop Camera</button>
    </div>

    <div id="count">—</div>
    <strong>People detected in current frame</strong>
    <p id="status">Camera stopped.</p>
  </section>

  <script>
    "use strict";

    const MODEL_PATH = "./models/yolov8n.onnx";
    const SIZE = 640;
    const THRESHOLD = 0.35;
    const IOU_THRESHOLD = 0.45;

    const video = document.getElementById("video");
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d", {
      willReadFrequently: true
    });

    const startBtn = document.getElementById("startBtn");
    const stopBtn = document.getElementById("stopBtn");
    const countEl = document.getElementById("count");
    const statusEl = document.getElementById("status");

    let stream = null;
    let session = null;
    let running = false;
    let busy = false;
    let lastFrame = 0;

    async function loadModel() {
      if (session) return session;

      statusEl.textContent = "Loading YOLOv8 model...";

      if (!window.ort) {
        throw new Error("ONNX Runtime library did not load.");
      }

      ort.env.wasm.wasmPaths =
        "https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/";

      session = await ort.InferenceSession.create(
        MODEL_PATH,
        { executionProviders: ["wasm"] }
      );

      return session;
    }

    function iou(a, b) {
      const x1 = Math.max(a.x1, b.x1);
      const y1 = Math.max(a.y1, b.y1);
      const x2 = Math.min(a.x2, b.x2);
      const y2 = Math.min(a.y2, b.y2);

      const intersection =
        Math.max(0, x2 - x1) * Math.max(0, y2 - y1);

      const areaA =
        Math.max(0, a.x2 - a.x1) *
        Math.max(0, a.y2 - a.y1);

      const areaB =
        Math.max(0, b.x2 - b.x1) *
        Math.max(0, b.y2 - b.y1);

      return intersection /
        (areaA + areaB - intersection + 1e-6);
    }

    function decodePeople(tensor) {
      const d = tensor.dims;
      const data = tensor.data;

      let n;
      let value;

      if (d.length === 3 && d[1] === 84) {
        n = d[2];
        value = (channel, index) => data[channel * n + index];
      } else if (d.length === 3 && d[2] === 84) {
        n = d[1];
        value = (channel, index) => data[index * 84 + channel];
      } else {
        throw new Error(
          "Unsupported model output shape: " + d.join(" × ")
        );
      }

      const candidates = [];

      for (let i = 0; i < n; i++) {
        // COCO class 0 = person.
        const score = value(4, i);

        if (score < THRESHOLD) continue;

        const cx = value(0, i);
        const cy = value(1, i);
        const w = value(2, i);
        const h = value(3, i);

        candidates.push({
          x1: cx - w / 2,
          y1: cy - h / 2,
          x2: cx + w / 2,
          y2: cy + h / 2,
          score
        });
      }

      candidates.sort((a, b) => b.score - a.score);

      const selected = [];

      for (const box of candidates) {
        if (selected.every(
          other => iou(box, other) < IOU_THRESHOLD
        )) {
          selected.push(box);
        }

        if (selected.length >= 100) break;
      }

      return selected;
    }

    async function detectFrame() {
      if (!running || busy || video.readyState < 2) return;

      busy = true;

      try {
        const inputCanvas = document.createElement("canvas");
        inputCanvas.width = SIZE;
        inputCanvas.height = SIZE;

        const inputCtx = inputCanvas.getContext("2d", {
          willReadFrequently: true
        });

        inputCtx.drawImage(video, 0, 0, SIZE, SIZE);

        const pixels =
          inputCtx.getImageData(0, 0, SIZE, SIZE).data;

        const plane = SIZE * SIZE;
        const input = new Float32Array(3 * plane);

        for (let i = 0; i < plane; i++) {
          input[i] = pixels[i * 4] / 255;
          input[plane + i] = pixels[i * 4 + 1] / 255;
          input[2 * plane + i] = pixels[i * 4 + 2] / 255;
        }

        const model = await loadModel();

        const feeds = {};
        feeds[model.inputNames[0]] = new ort.Tensor(
          "float32",
          input,
          [1, 3, SIZE, SIZE]
        );

        const result = await model.run(feeds);
        const boxes = decodePeople(
          result[model.outputNames[0]]
        );

        if (!running) return;

        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;

        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

        const sx = canvas.width / SIZE;
        const sy = canvas.height / SIZE;

        ctx.lineWidth = Math.max(2, canvas.width / 400);
        ctx.font = "bold 16px Arial";

        for (const box of boxes) {
          const x = Math.max(0, box.x1 * sx);
          const y = Math.max(0, box.y1 * sy);
          const w = Math.max(0, (box.x2 - box.x1) * sx);
          const h = Math.max(0, (box.y2 - box.y1) * sy);

          ctx.strokeStyle = "#39e58c";
          ctx.strokeRect(x, y, w, h);

          const label = "Person " +
            Math.round(box.score * 100) + "%";

          ctx.fillStyle = "#39e58c";
          ctx.fillRect(x, Math.max(0, y - 23),
            ctx.measureText(label).width + 10, 23);

          ctx.fillStyle = "#10251b";
          ctx.fillText(label, x + 5, Math.max(16, y - 7));
        }

        countEl.textContent = boxes.length;
        statusEl.textContent =
          "Detection active · " + boxes.length + " person(s) detected.";

      } catch (error) {
        console.error(error);
        statusEl.textContent = "Detection error: " + error.message;
        stopCamera();
      } finally {
        busy = false;
      }
    }

    function loop(timestamp) {
      if (!running) return;

      if (timestamp - lastFrame >= 250 && !busy) {
        lastFrame = timestamp;
        detectFrame();
      }

      requestAnimationFrame(loop);
    }

    async function startCamera() {
      startBtn.disabled = true;

      try {
        if (!navigator.mediaDevices?.getUserMedia) {
          throw new Error(
            "Camera requires HTTPS or localhost in a supported browser."
          );
        }

        await loadModel();

        stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "user" },
          audio: false
        });

        video.srcObject = stream;
        await video.play();

        running = true;
        stopBtn.disabled = false;

        statusEl.textContent = "Camera started. Detecting people...";
        requestAnimationFrame(loop);

      } catch (error) {
        console.error(error);
        statusEl.textContent = error.message;
        stopCamera();
      }
    }

    function stopCamera() {
      running = false;

      if (stream) {
        stream.getTracks().forEach(track => track.stop());
      }

      stream = null;
      video.srcObject = null;

      startBtn.disabled = false;
      stopBtn.disabled = true;
      countEl.textContent = "—";

      ctx.clearRect(0, 0, canvas.width, canvas.height);
      statusEl.textContent = "Camera stopped.";
    }

    startBtn.addEventListener("click", startCamera);
    stopBtn.addEventListener("click", stopCamera);
  </script>
</body>
</html>
