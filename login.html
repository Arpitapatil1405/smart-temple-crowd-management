
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Smart Temple</title>
  <link rel="stylesheet" href="./login.css">
</head>
<body>
  <header>
    <a href="./index.html">🛕 Smart Temple</a>
  </header>

  <main>
    <section class="welcome">
      <p>YOUR SPIRITUAL JOURNEY</p>
      <h1>Every Darshan<br>Begins with <span>Faith.</span></h1>
      <p>Sign in to book your darshan and manage your temple visit.</p>
    </section>

    <section class="login-card">
      <div class="tabs">
        <button id="loginTab" class="active" onclick="showLogin()">Login</button>
        <button id="registerTab" onclick="showRegister()">Register</button>
      </div>

      <div id="loginPanel">
        <h2>Welcome back</h2>
        <form id="loginForm">
          <label for="loginRole">Login as</label>
          <select id="loginRole">
            <option value="devotee">Devotee</option>
            <option value="temple-admin">Temple Admin</option>
            <option value="main-admin">Main Admin</option>
          </select>

          <label for="loginEmail">Email ID</label>
          <input id="loginEmail" type="email" placeholder="Enter email" required>

          <label for="loginPassword">Password</label>
          <input id="loginPassword" type="password" placeholder="Enter password" required>

          <button class="submit" type="submit">Login →</button>
          <p id="loginMessage" role="status"></p>
        </form>
        <p>Don't have an account? <button class="text-btn" onclick="showRegister()">Register</button></p>
      </div>

      <div id="registerPanel" hidden>
        <h2>Create account</h2>
        <form id="registerForm">
          <label for="registerRole">Register as</label>
          <select id="registerRole" onchange="updateFields()">
            <option value="devotee">Devotee</option>
            <option value="temple-admin">Temple Admin</option>
          </select>

          <label for="fullName">Full Name</label>
          <input id="fullName" type="text" placeholder="Enter full name" required>

          <div id="templeFields" hidden>
            <label for="templeName">Temple Name</label>
            <input id="templeName" type="text" placeholder="Enter temple name">

            <label for="templeCode">Temple Code</label>
            <input id="templeCode" type="text" placeholder="Enter temple code">
          </div>

          <label for="registerEmail">Email ID</label>
          <input id="registerEmail" type="email" placeholder="Enter email" required>

          <label for="registerPassword">Password</label>
          <input id="registerPassword" type="password" minlength="8" placeholder="Minimum 8 characters" required>

          <button class="submit" type="submit">Create Account →</button>
          <p id="registerMessage" role="status"></p>
        </form>
        <p>Already registered? <button class="text-btn" onclick="showLogin()">Login</button></p>
      </div>
    </section>
  </main>

  
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://vdcxvxtgkzwsknxmevwt.supabase.co";
const SUPABASE_KEY = "sb_publishable_xKYJqVUJ9CzA7TFxKKKjKQ_Nn6bdDLM";

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

function showLogin() {
  document.getElementById("loginPanel").hidden = false;
  document.getElementById("registerPanel").hidden = true;
  document.getElementById("loginTab").classList.add("active");
  document.getElementById("registerTab").classList.remove("active");
}

function showRegister() {
  document.getElementById("loginPanel").hidden = true;
  document.getElementById("registerPanel").hidden = false;
  document.getElementById("loginTab").classList.remove("active");
  document.getElementById("registerTab").classList.add("active");
  updateFields();
}

function updateFields() {
  const isAdmin =
    document.getElementById("registerRole").value === "temple-admin";

  document.getElementById("templeFields").hidden = !isAdmin;
  document.getElementById("templeName").required = isAdmin;
  document.getElementById("templeCode").required = isAdmin;
}

// Devotee registration
document.getElementById("registerForm").addEventListener("submit", async (e) => {
  e.preventDefault();

  const msg = document.getElementById("registerMessage");
  const role = document.getElementById("registerRole").value;

  if (role !== "devotee") {
    msg.textContent = "Admin registration requires authorized approval.";
    return;
  }

  const name = document.getElementById("fullName").value.trim();
  const email = document.getElementById("registerEmail").value.trim();
  const password = document.getElementById("registerPassword").value;

  msg.textContent = "Registering...";

  try {
    const { error } = await sb.auth.signUp({
      email,
      password,
      options: {
        data: { full_name: name, role: "devotee" },
        emailRedirectTo: window.location.href.split("?")[0].split("#")[0]
      }
    });

    msg.textContent = error
      ? error.message
      : "Registration submitted! Check your email for the verification link.";
  } catch (error) {
    msg.textContent = "Connection error. Check your internet and Supabase settings.";
    console.error(error);
  }
});

// Devotee login
document.getElementById("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();

  const msg = document.getElementById("loginMessage");
  const role = document.getElementById("loginRole").value;

  
if (role === "main-admin") {
  msg.textContent = "Signing in...";

  try {
    const { data, error } = await sb.auth.signInWithPassword({
      email: document.getElementById("loginEmail").value.trim(),
      password: document.getElementById("loginPassword").value
    });

    if (error) {
      msg.textContent = error.message;
      return;
    }

    const { data: profile, error: profileError } = await sb
      .from("profiles")
      .select("role")
      .eq("id", data.user.id)
      .maybeSingle();

    console.log("Authenticated user ID:", data.user.id);
    console.log("Main Admin profile:", profile);
    console.log("Profile lookup error:", profileError);

    if (profileError) {
      msg.textContent = "Could not verify admin role: " + profileError.message;
      await sb.auth.signOut();
      return;
    }

    const actualRole = String(profile?.role || "")
      .trim()
      .toLowerCase()
      .replace(/-/g, "_");

    if (actualRole !== "main_admin") {
      msg.textContent =
        "This account is not authorized as Main Admin. Detected role: " +
        (actualRole || "no profile found");
      await sb.auth.signOut();
      return;
    }

    window.location.href = "./main-admin-dashboard.html";
  } catch (error) {
    console.error("Main Admin login error:", error);
    msg.textContent = "Unable to log in: " + error.message;
  }

  return;
}


if (role !== "devotee") {
  msg.textContent = "Temple Admin login will be enabled later.";
  return;
}

  msg.textContent = "Signing in...";

  try {
    const { data, error } = await sb.auth.signInWithPassword({
      email: document.getElementById("loginEmail").value.trim(),
      password: document.getElementById("loginPassword").value
    });

    if (error) {
      msg.textContent = error.message;
      return;
    }

    if (!data.user.email_confirmed_at) {
      await sb.auth.signOut();
      msg.textContent = "Please verify your email before logging in.";
      return;
    }

    window.location.href = "./devotee-dashboard.html";
  } catch (error) {
    msg.textContent = "Connection error. Please try again.";
    console.error(error);
  }
});
</script>

</body>
</html>
