
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Smart Temple</title>
  <link rel="stylesheet" href="./login.css">
</head>
<body>
  <header>
    <a href="./index.html">🛕 Smart Temple</a>
  </header>

  <main>
    <section class="welcome">
      <p>YOUR SPIRITUAL JOURNEY</p>
      <h1>Every Darshan<br>Begins with <span>Faith.</span></h1>
      <p>Sign in to book your darshan and manage your temple visit.</p>
    </section>

    <section class="login-card">
      <div class="tabs">
        <button id="loginTab" class="active" type="button"
          onclick="showLogin()">Login</button>
        <button id="registerTab" type="button"
          onclick="showRegister()">Register</button>
      </div>

      <div id="loginPanel">
        <h2>Welcome back</h2>
        <form id="loginForm">
          <label for="loginRole">Login as</label>
          <select id="loginRole">
            <option value="devotee">Devotee</option>
            <option value="temple-admin">Temple Admin</option>
            <option value="main-admin">Main Admin</option>
          </select>

          <label for="loginEmail">Email ID</label>
          <input id="loginEmail" type="email"
            placeholder="Enter email" required>

          <label for="loginPassword">Password</label>
          <input id="loginPassword" type="password"
            placeholder="Enter password" required>

          <button class="submit" type="submit">Login →</button>
          <p id="loginMessage" role="status"></p>
        </form>

        <p>Don't have an account?
          <button class="text-btn" type="button"
            onclick="showRegister()">Register</button>
        </p>
      </div>

      <div id="registerPanel" hidden>
        <h2>Create account</h2>
        <form id="registerForm">
          <label for="registerRole">Register as</label>
          <select id="registerRole" onchange="updateFields()">
            <option value="devotee">Devotee</option>
            <option value="temple-admin">Temple Admin</option>
          </select>

          <label for="fullName">Full Name</label>
          <input id="fullName" type="text"
            placeholder="Enter full name" required>

          <div id="templeFields" hidden>
            <label for="templeName">Select Temple</label>
            <select id="templeName">
              <option value="">Loading temples...</option>
            </select>

            <label for="templeCode">Temple Admin Code</label>
            <input id="templeCode" type="text"
              placeholder="Enter code provided by Main Admin"
              autocomplete="off">
          </div>

          <label for="registerEmail">Email ID</label>
          <input id="registerEmail" type="email"
            placeholder="Enter email" required>

          <label for="registerPassword">Password</label>
          <input id="registerPassword" type="password"
            minlength="8" placeholder="Minimum 8 characters" required>

          <button class="submit" type="submit">Create Account →</button>
          <p id="registerMessage" role="status"></p>
        </form>

        <p>Already registered?
          <button class="text-btn" type="button"
            onclick="showLogin()">Login</button>
        </p>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
   const SUPABASE_URL = "https://vdcxvxtgkzwsknxmevwt.supabase.co";
const SUPABASE_KEY = "sb_publishable_xKYJqVUJ9CzA7TFxKKKjKQ_Nn6bdDLM";

    const sb = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    function showLogin() {
      document.getElementById("loginPanel").hidden = false;
      document.getElementById("registerPanel").hidden = true;
      document.getElementById("loginTab").classList.add("active");
      document.getElementById("registerTab").classList.remove("active");
    }

    function showRegister() {
      document.getElementById("loginPanel").hidden = true;
      document.getElementById("registerPanel").hidden = false;
      document.getElementById("loginTab").classList.remove("active");
      document.getElementById("registerTab").classList.add("active");
      updateFields();
    }

    function updateFields() {
      const isAdmin =
        document.getElementById("registerRole").value === "temple-admin";

      document.getElementById("templeFields").hidden = !isAdmin;
      document.getElementById("templeName").required = isAdmin;
      document.getElementById("templeCode").required = isAdmin;
    }

    // Load temples for the Temple Admin registration dropdown.
    async function loadTemples() {
      const select = document.getElementById("templeName");

      const { data, error } = await sb
        .from("temples")
        .select("id, name, city")
        .order("name");

      if (error) {
        select.innerHTML =
          '<option value="">Unable to load temples</option>';
        console.error("Temple loading error:", error);
        return;
      }

      select.innerHTML =
        '<option value="">Select your temple</option>';

      (data || []).forEach(temple => {
        const option = document.createElement("option");
        option.value = temple.id;
        option.textContent = temple.city
          ? `${temple.name} — ${temple.city}`
          : temple.name;
        select.appendChild(option);
      });
    }

    loadTemples();

    // Registration: Devotee and Temple Admin.
    document.getElementById("registerForm")
      .addEventListener("submit", async (e) => {
        e.preventDefault();

        const msg = document.getElementById("registerMessage");
        const role = document.getElementById("registerRole").value;
        const name = document.getElementById("fullName").value.trim();
        const email = document.getElementById("registerEmail")
          .value.trim();
        const password =
          document.getElementById("registerPassword").value;

        const templeId =
          document.getElementById("templeName").value;
        const templeCode =
          document.getElementById("templeCode").value.trim();

        if (role === "temple-admin" && (!templeId || !templeCode)) {
          msg.textContent = "Select a temple and enter your admin code.";
          return;
        }

        msg.textContent = "Creating your account...";

        try {
          // Do not assign an admin role using signup metadata.
          // The trusted database function must validate the code
          // and create the Temple Admin profile.
          const signupOptions = role === "devotee"
            ? { data: { full_name: name, role: "devotee" } }
            : { data: { full_name: name } };

          const { data, error } = await sb.auth.signUp({
            email,
            password,
            options: signupOptions
          });

          if (error) {
            msg.textContent = error.message;
            return;
          }

          if (!data.user) {
            msg.textContent = "Account creation did not return a user.";
            return;
          }

          if (role === "devotee") {
            msg.textContent = data.session
              ? "Registration successful! You can now log in."
              : "Account created. If email confirmation is enabled in Supabase, complete it before logging in.";
            return;
          }

          // A signed-in session is required for the secure RPC.
          if (!data.session) {
            msg.textContent =
              "Account created, but no active session was returned. Check that email confirmation is disabled in Supabase. If this email was already registered, log in instead.";
            return;
          }

          msg.textContent = "Verifying your Temple Admin code...";

          // This RPC must validate and consume the code on the server,
          // then create the profiles row with role and temple_id.
          const { error: redeemError } = await sb.rpc(
            "redeem_temple_admin_code",
            {
              p_code: templeCode,
              p_temple_id: templeId,
              p_full_name: name
            }
          );

          if (redeemError) {
            console.error("Temple code redemption error:", redeemError);
            msg.textContent =
              "Account created, but Temple Admin setup failed: " +
              redeemError.message +
              ". Do not register again with another email. Check the database setup.";
            return;
          }

          msg.textContent =
            "Temple Admin registered successfully! You can now log in.";

          document.getElementById("loginRole").value = "temple-admin";
          document.getElementById("loginEmail").value = email;
          showLogin();

        } catch (error) {
          console.error("Registration error:", error);
          msg.textContent =
            error.message || "Connection error. Please try again.";
        }
      });

    // Login: Main Admin, Temple Admin and Devotee.
    document.getElementById("loginForm")
      .addEventListener("submit", async (e) => {
        e.preventDefault();

        const msg = document.getElementById("loginMessage");
        const role = document.getElementById("loginRole").value;
        const email =
          document.getElementById("loginEmail").value.trim();
        const password =
          document.getElementById("loginPassword").value;

        msg.textContent = "Signing in...";

        try {
          const { data, error } = await sb.auth.signInWithPassword({
            email,
            password
          });

          if (error) {
            msg.textContent = error.message;
            return;
          }

          const { data: profile, error: profileError } = await sb
            .from("profiles")
            .select("role, temple_id")
            .eq("id", data.user.id)
            .maybeSingle();

          if (profileError) {
            msg.textContent =
              "Could not verify your account role: " +
              profileError.message;
            await sb.auth.signOut();
            return;
          }

          const actualRole = String(profile?.role || "")
            .trim()
            .toLowerCase()
            .replace(/-/g, "_");

          if (role === "main-admin") {
            if (actualRole !== "main_admin") {
              msg.textContent =
                "This account is not authorized as Main Admin.";
              await sb.auth.signOut();
              return;
            }

            window.location.href = "./main-admin-dashboard.html";
            return;
          }

          if (role === "temple-admin") {
            if (actualRole !== "temple_admin" || !profile.temple_id) {
              msg.textContent =
                "This account is not assigned as a Temple Admin. Contact the Main Admin.";
              await sb.auth.signOut();
              return;
            }

            window.location.href = "./temple-admin-dashboard.html";
            return;
          }

          if (role === "devotee") {
            if (actualRole && actualRole !== "devotee") {
              msg.textContent =
                "This account belongs to a different user role. Select the correct login type.";
              await sb.auth.signOut();
              return;
            }

            window.location.href = "./devotee-dashboard.html";
            return;
          }

          msg.textContent = "Please select a valid login role.";
          await sb.auth.signOut();

        } catch (error) {
          console.error("Login error:", error);
          msg.textContent =
            error.message || "Connection error. Please try again.";
        }
      });

    updateFields();
  </script>
</body>
</html>
